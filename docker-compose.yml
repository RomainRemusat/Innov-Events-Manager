version: '3.8'

services:
  # Serveur Web (ton application PHP en architecture MVC)
  app:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
      - mongodb
    networks:
      - innovevents-net

  # Base de données Relationnelle (MySQL)
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: innovevents_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    networks:
      - innovevents-net

  # Base NoSQL pour la journalisation des logs (MongoDB)
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    networks:
      - innovevents-net

  # Interface graphique web pour l'administration simplifiée de MySQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8082:80"
    depends_on:
      - db
    networks:
      - innovevents-net

networks:
  innovevents-net:
    driver: bridge