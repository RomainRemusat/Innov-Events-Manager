version: '3.8'

services:
  # Serveur Web (Application PHP-Apache / Front Controller)
  app:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - mongodb
    networks:
      - innovevents-net

  # Serveur SMTP de Test / Intercepteur de mails (MailHog)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: innovevents_mailhog
    ports:
      - "1025:1025" # Port SMTP (pour l'envoi de mails depuis PHPMailer)
      - "8025:8025" # Port HTTP (Interface Web pour consulter les mails reçus)
    networks:
      - innovevents-net

  # Base de données Relationnelle (MySQL 8.0) - Prospects, Users, Clients et Événements
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - innovevents-net

  # Base NoSQL (MongoDB) - Dédiée à la journalisation d'audit de sécurité et compliance
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - innovevents-net

  # Outil d'administration graphique pour la base MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
    networks:
      - innovevents-net

# Déclaration du réseau privé virtuel isolé
networks:
  innovevents-net:
    driver: bridge

# Déclaration des volumes persistants nommés (Évite la perte de données au redémarrage)
volumes:
  db_data:
  mongo_data: