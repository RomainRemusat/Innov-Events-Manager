services:
  # Serveur Web (ton application PHP)
  app:
    build: .
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
      - mongodb
    networks:
      - innovevents-net

  # Base de données Relationnelle (MySQL) - Pour les Prospects, Clients et Événements
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: innovevents_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    networks:
      - innovevents-net

  # Base NoSQL (MongoDB) - Exigence ECF pour la journalisation des actions
  mongodb:
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    networks:
      - innovevents-net

  # Outil de gestion graphique pour MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    networks:
      - innovevents-net

networks:
  innovevents-net:
    driver: bridge