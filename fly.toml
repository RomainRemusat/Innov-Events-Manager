app = "innov-events-manager-romain"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  BASE_URL = "https://innov-events-manager-romain.fly.dev"
  DB_HOST = "innov-events-mysql-romain.internal"
  DB_PORT = "3306"
  DB_NAME = "innovevents_db"
  DB_USER = "innovevents"
  MONGO_DATABASE = "innovevents_nosql"
  PERSISTENT_DATA_DIR = "/data"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "app_data"
  destination = "/data"
